<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tarefas DARMAND</title>
<link rel="icon" type="image/png" href="/marca/icone-64.png">
<link rel="apple-touch-icon" href="/marca/icone-180.png">
<meta name="theme-color" content="#9d162e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --brand:#9d162e;--brand-soft:#f6e8eb;--bg:#f5f4f2;--surface:#fff;--surface2:#faf9f8;--ink:#1d1d1b;--muted:#76757a;--line:#e7e5e2;
  --red:#c0392b;--red-soft:#fbeaea;--amber:#b7791f;--amber-soft:#fdf3e1;--blue:#2b6cb0;--blue-soft:#e8f0fa;--green:#2f855a;--green-soft:#e6f4ec;--gray-soft:#efeeec;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root{
  --brand:#d0425c;--brand-soft:#3a1c22;--bg:#141414;--surface:#1f1f1f;--surface2:#242424;--ink:#f1f0ee;--muted:#a3a2a6;--line:#333;
  --red:#ef6b5e;--red-soft:#3b1f1c;--amber:#e0a84a;--amber-soft:#382c17;--blue:#6aa5e8;--blue-soft:#1b2a3b;--green:#5cc28a;--green-soft:#183027;--gray-soft:#2a2a2a;
  --shadow:none;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
.oculto{display:none!important}

/* topo */
header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topo{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap}
.logo img{width:28px;height:28px;border-radius:7px}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:500;white-space:nowrap}
nav button:hover{background:var(--gray-soft);color:var(--ink)}
nav button.ativo{background:var(--brand-soft);color:var(--brand)}
.eu{display:flex;align-items:center;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--gray-soft)}
.btn.prim{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.prim:hover{filter:brightness(1.08)}
.btn.perigo{color:var(--red)}
.btn.peq{padding:5px 10px;font-size:13px}
.menu-eu{position:relative}
.menu-eu .pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:220px;max-width:calc(100vw - 32px);padding:6px;z-index:30}
.menu-eu .pop div{padding:8px 10px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu-eu .pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px}
.menu-eu .pop button:hover{background:var(--gray-soft)}
.btn-eu{border:0;background:none;padding:0;border-radius:50%;display:grid}
.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:600;color:#fff;flex:none;overflow:hidden;object-fit:cover;border:0;padding:0}
.av.p{width:24px;height:24px;font-size:10px}
.av.g{width:40px;height:40px;font-size:14px}

main{max-width:1240px;margin:0 auto;padding:20px 16px 60px}
h2{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.secao{margin-top:26px}
.secao h3{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.secao h3 .n{color:var(--muted);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.vazio{padding:24px;text-align:center;color:var(--muted)}

/* indicadores */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left;border-left:4px solid var(--line)}
button.kpi:hover{border-color:var(--muted)}
.kpi .v{font-size:28px;font-weight:700;line-height:1.1}
.kpi .r{color:var(--muted);font-size:13px;margin-top:2px}
.kpi.vermelho{border-left-color:var(--red)}.kpi.vermelho .v{color:var(--red)}
.kpi.ambar{border-left-color:var(--amber)}.kpi.ambar .v{color:var(--amber)}
.kpi.azul{border-left-color:var(--blue)}
.kpi.verde{border-left-color:var(--green)}.kpi.verde .v{color:var(--green)}

/* lista de tarefas */
.lista{overflow:hidden}
.linha{display:grid;grid-template-columns:28px 1fr auto auto auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
.linha:first-child{border-top:0}
.linha:hover{background:var(--surface2)}
.linha .tit{font-weight:500;min-width:0}
.linha .tit span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linha .tit small{color:var(--muted);font-weight:400;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
.linha.feita .tit span{text-decoration:line-through;color:var(--muted)}
.chk{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);background:none;padding:0;display:grid;place-items:center}
.chk:hover{border-color:var(--green)}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.chk:disabled{cursor:default;opacity:.5}
.chk svg{width:12px;height:12px}
.selo{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--gray-soft);color:var(--muted)}
.selo.atrasada{background:var(--red-soft);color:var(--red)}
.selo.hoje{background:var(--amber-soft);color:var(--amber)}
.selo.semana{background:var(--blue-soft);color:var(--blue)}
.selo.ok{background:var(--green-soft);color:var(--green)}
.pri{font-size:12px;font-weight:600}
.pri.p4{color:var(--red)}.pri.p3{color:var(--amber)}.pri.p2{color:var(--muted);font-weight:500}.pri.p1{color:var(--muted);font-weight:400}
.proj{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.proj i{width:8px;height:8px;border-radius:2px;display:inline-block}
.st{font-size:12px;color:var(--muted)}

/* filtros */
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.filtros input,.filtros select{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);min-width:0}
.filtros input[type=search]{flex:1;min-width:180px}
.alterna{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-left:auto}
.alterna button{border:0;background:var(--surface);padding:8px 12px;color:var(--muted)}
.alterna button.ativo{background:var(--brand-soft);color:var(--brand);font-weight:600}

/* quadro */
.quadro{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.coluna{background:var(--gray-soft);border-radius:14px;padding:10px;min-height:200px}
.coluna h4{margin:2px 4px 10px;font-size:13px;display:flex;justify-content:space-between;color:var(--muted)}
.coluna.alvo{outline:2px dashed var(--brand);outline-offset:-2px}
.cartao{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}
.cartao:hover{border-color:var(--muted)}
.cartao .t{font-weight:500;margin-bottom:8px}
.cartao .m{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cartao .m .av{margin-left:auto}
.cartao.arrastando{opacity:.4}

/* calendário */
.cal-topo{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-topo strong{font-size:16px;min-width:170px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.cal .dsem{padding:8px;font-size:12px;color:var(--muted);text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface2)}
.cal .dia{min-height:96px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;overflow:hidden}
.cal .dia:hover{background:var(--surface2)}
.cal .dia.fora{background:var(--surface2);color:var(--muted)}
.cal .dia.hoje .num{background:var(--brand);color:#fff}
.cal .dia.sel{outline:2px solid var(--brand);outline-offset:-2px}
.cal .num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:12px;font-weight:600;margin-bottom:4px}
.cal .ch{display:block;font-size:11.5px;padding:2px 6px;border-radius:5px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--blue-soft);color:var(--blue)}
.cal .ch.atrasada{background:var(--red-soft);color:var(--red)}
.cal .ch.hoje{background:var(--amber-soft);color:var(--amber)}
.cal .ch.ok{background:var(--green-soft);color:var(--green);text-decoration:line-through}
.cal .mais{font-size:11px;color:var(--muted)}
.prazos-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;align-items:start}

/* equipe */
.tabela{width:100%;border-collapse:collapse}
.tabela th{font-size:12px;color:var(--muted);font-weight:500;text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tabela th:first-child{text-align:left}
.tabela td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.tabela td:first-child{text-align:left}
.tabela tr:last-child td{border-bottom:0}
.tabela tr.click{cursor:pointer}
.tabela tr.click:hover td{background:var(--surface2)}
.pess{display:flex;align-items:center;gap:10px}
.pess b{font-weight:600;display:block}
.pess small{color:var(--muted)}
.barra{height:6px;border-radius:3px;background:var(--gray-soft);overflow:hidden;min-width:60px}
.barra i{display:block;height:100%;background:var(--green)}
.inativo{opacity:.5}
.tag{font-size:11px;padding:1px 6px;border-radius:5px;background:var(--brand-soft);color:var(--brand);font-weight:600;margin-left:6px}

/* cronograma (Gantt) */
.gantt{overflow:auto;max-height:calc(100vh - 230px);min-height:240px;position:relative}
.phead ~ .secao .gantt{max-height:none}
.g-linha{display:flex;min-width:max-content;border-bottom:1px solid var(--line)}
.g-rot{position:sticky;left:0;z-index:3;width:300px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:6px 10px;display:flex;align-items:center;gap:8px;min-height:38px}
.g-rot .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.g-rot .nm:hover{color:var(--brand)}
.g-rot select{max-width:110px;padding:3px 4px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-size:12px}
.g-pista{position:relative;flex:none}
.g-cab{position:sticky;top:0;z-index:4;background:var(--surface2)}
.g-cab .g-rot{background:var(--surface2);font-size:12px;color:var(--muted);font-weight:600;z-index:5}
.g-meses,.g-dias{position:relative;height:22px}
.g-meses span,.g-dias span{position:absolute;top:0;height:22px;line-height:22px;font-size:11px;color:var(--muted);border-left:1px solid var(--line);padding-left:4px;white-space:nowrap;overflow:hidden}
.g-meses span{font-weight:600;color:var(--ink)}
.g-dias span.hj{background:var(--brand);color:#fff;font-weight:600}
.g-grupo .g-rot{background:var(--surface2);font-weight:600}
.g-grupo .g-pista{background:var(--surface2)}
.g-grupo .g-rot .ct{color:var(--muted);font-weight:500;font-size:12px}
.g-fds{position:absolute;top:0;bottom:0;background:var(--gray-soft);opacity:.55;pointer-events:none}
.g-hoje{position:absolute;top:0;bottom:0;width:2px;background:var(--brand);z-index:2;pointer-events:none}
.g-barra{position:absolute;top:8px;height:22px;border-radius:6px;background:var(--brand);color:#fff;font-size:11.5px;font-weight:500;line-height:22px;padding:0 8px;white-space:nowrap;overflow:visible;z-index:1;touch-action:none;user-select:none}
.g-barra.mexe{cursor:grab}.g-barra.mexe:active{cursor:grabbing}
.g-barra .lb{position:absolute;left:100%;margin-left:6px;color:var(--ink);font-weight:500}
.g-barra.cabe .lb{position:static;margin:0;color:inherit}
.g-barra.cabe{overflow:hidden;text-overflow:ellipsis}
.g-barra.st-andamento{background:var(--blue)}
.g-barra.st-aguardando{background:var(--amber)}
.g-barra.st-concluida{background:var(--green);opacity:.75}
.g-barra.st-atrasada{background:var(--red)}
.g-barra .al{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize}
.g-barra .al.e{left:-2px}.g-barra .al.d{right:-2px}
.g-barra.proj{top:12px;height:14px;border-radius:4px;opacity:.35}
.g-vazia{position:absolute;inset:0;cursor:copy}
.g-vazia:hover{background:repeating-linear-gradient(90deg,transparent 0 6px,var(--brand-soft) 6px 12px)}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legenda i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* projetos */
.projs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pcard{padding:16px;cursor:pointer;border-top:4px solid var(--brand);display:flex;flex-direction:column;gap:10px}
.pcard:hover{border-color:var(--muted)}
.pcard h4{margin:0;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pcard .desc{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:0}
.pcard .lin{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.progresso{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
.progresso .barra{flex:1;height:8px;border-radius:4px}
.saude{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.saude.ok{background:var(--green-soft);color:var(--green)}
.saude.risco{background:var(--amber-soft);color:var(--amber)}
.saude.atrasado{background:var(--red-soft);color:var(--red)}
.saude.neutro{background:var(--gray-soft);color:var(--muted)}
.voltar{border:0;background:none;color:var(--muted);padding:0;margin-bottom:10px;font-weight:500}
.voltar:hover{color:var(--brand)}
.phead{padding:18px 20px;border-top:5px solid var(--brand);margin-bottom:16px}
.phead h2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pinfo{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px}
.pinfo div small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.pinfo div b{font-weight:600}

/* narrar */
.janela.larga{max-width:980px}
.narra-txt{width:100%;min-height:170px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:15px;line-height:1.5;resize:vertical}
.narra-txt:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:transparent}
.narra-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.mic{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:999px;font-weight:600}
.mic .ponto{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.mic.on{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.mic.on .ponto{background:var(--red);animation:pulsa 1s infinite}
@keyframes pulsa{50%{opacity:.25}}
.dica{font-size:12.5px;color:var(--muted)}
.carrega-ia{display:flex;align-items:center;gap:12px;padding:30px 4px;color:var(--muted)}
.giro{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.resumo-ia{background:var(--brand-soft);color:var(--ink);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-weight:500}
.duvidas{background:var(--amber-soft);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.duvidas b{color:var(--amber)}
.duvidas ul{margin:6px 0 0;padding-left:18px}
.prop{display:grid;grid-template-columns:24px minmax(180px,2.2fr) 1fr 1.2fr 128px 128px 92px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.prop.cab{font-size:12px;color:var(--muted);font-weight:500;padding-top:0}
.prop input[type=text],.prop input[type=date],.prop select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px;min-width:0}
.prop input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand)}
.prop.off{opacity:.45}
.prop .det{grid-column:2/-1;font-size:12px;color:var(--muted);margin-top:-4px}
.pnovo{display:flex;gap:10px;align-items:center;padding:8px 12px;border:1px dashed var(--brand);border-radius:10px;margin-bottom:8px;flex-wrap:wrap}
.pnovo input[type=text]{flex:1;min-width:160px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.pnovo .tag{margin:0}

/* janela */
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.janela{background:var(--surface);border-radius:16px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.janela .cab{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.janela .cab h3{margin:0;font-size:16px}
.janela .cab button{border:0;background:none;font-size:22px;line-height:1;color:var(--muted);padding:4px 8px}
.janela .corpo{padding:18px 20px}
.janela .rodape{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
.janela .rodape .esq{margin-right:auto}
.campo{display:block;margin-bottom:14px}
.campo>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:500}
.campo input,.campo select,.campo textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:transparent}
.campo input:disabled,.campo select:disabled,.campo textarea:disabled{background:var(--surface2);color:var(--muted)}
.campo textarea{min-height:90px;resize:vertical}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.aviso{font-size:12.5px;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:14px}
.hist{margin-top:6px;border-top:1px solid var(--line);padding-top:14px}
.hist h4{margin:0 0 10px;font-size:13px}
.ev{display:flex;gap:10px;margin-bottom:10px;font-size:13px}
.ev .txt{flex:1;min-width:0}
.ev .txt b{font-weight:600}
.ev .txt small{color:var(--muted);margin-left:6px}
.ev.evento{color:var(--muted)}
.ev.evento .ponto{width:24px;display:grid;place-items:center;flex:none}
.ev.evento .ponto i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.ev .nota{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;margin-top:3px;white-space:pre-wrap;word-wrap:break-word;color:var(--ink)}
.ev .apaga{border:0;background:none;color:var(--muted);font-size:12px;padding:0;margin-left:6px}
.novo-coment{display:flex;gap:8px;margin-top:8px}
.novo-coment textarea{flex:1;min-height:40px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);resize:vertical}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-size:13.5px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.erro{background:var(--red);color:#fff}
.carregando{padding:60px;text-align:center;color:var(--muted)}

@media (max-width:900px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .prazos-grid{grid-template-columns:1fr}
  .esconde-m{display:none}
  .pinfo{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:640px){
  .topo{flex-wrap:wrap;gap:8px 12px}
  nav{order:3;flex-basis:100%}
  .logo span{display:none}
  .eu{margin-left:auto}
  .linha{grid-template-columns:24px 1fr auto;gap:10px}
  .linha .esconde-p{display:none}
  .duas{grid-template-columns:1fr}
  .cal .dia{min-height:58px;padding:3px}
  .cal .ch{font-size:0;padding:0;height:6px;border-radius:3px;margin-bottom:2px}
  .cal .mais{display:none}
  .alterna{margin-left:0}
  .tabela .esconde-p{display:none}
  .g-rot{width:150px}
  .g-rot select{display:none}
  .gantt{max-height:none}
  .projs{grid-template-columns:1fr}
  .prop{grid-template-columns:24px 1fr 1fr;row-gap:6px}
  .prop>:nth-child(2){grid-column:2/-1}
  .prop>:nth-child(3),.prop>:nth-child(5),.prop>:nth-child(7){grid-column:2}
  .prop>:nth-child(4),.prop>:nth-child(6){grid-column:3}
  .janela .rodape{flex-wrap:wrap}
  .janela .rodape .esq{flex-basis:100%}
  .prop.cab{display:none}
  .prop .det{grid-column:1/-1;margin:0}
  #btnNarrar{padding:8px 10px}
  .fundo{padding:0}
  .janela{border-radius:0;min-height:100vh}
}
</style>

<body>
<header>
  <div class="topo">
    <div class="logo"><img src="/marca/icone-64.png" alt=""><span>Tarefas</span></div>
    <nav id="nav">
      <button data-v="inicio" class="ativo">Início</button>
      <button data-v="tarefas">Tarefas</button>
      <button data-v="cronograma">Cronograma</button>
      <button data-v="prazos">Prazos</button>
      <button data-v="projetos">Projetos</button>
      <button data-v="equipe">Equipe</button>
    </nav>
    <div class="eu">
      <button class="btn" id="btnNarrar" title="Fale ou escreva o que precisa ser feito e a IA monta as tarefas">🎙 Narrar</button>
      <button class="btn prim" id="btnNova">+ Nova tarefa</button>
      <div class="menu-eu">
        <button class="btn-eu" id="btnEu" aria-label="Minha conta"></button>
        <div class="pop oculto" id="popEu"></div>
      </div>
    </div>
  </div>
</header>
<main id="main"><div class="carregando">Carregando…</div></main>

<script>
// ---------------- estado ----------------
const S = { me: null, pessoas: [], projetos: [], tarefas: [], vista: 'inicio', modo: localGet('modo') || 'lista',
  f: { q: '', resp: '', proj: '', sit: 'abertas', prazo: '' }, mes: null, diaSel: null,
  g: { agrupar: localGet('agrupar') || 'projeto', escala: localGet('escala') || 'semanas', resp: '', proj: '', concluidas: false }, gScroll: null,
  pf: 'abertos', projetoSel: null };
const PROJ_STATUS = [['planejamento', 'Planejamento'], ['andamento', 'Em andamento'], ['pausado', 'Pausado'], ['concluido', 'Concluído'], ['cancelado', 'Cancelado']];
const PROJ_STATUS_NOME = Object.fromEntries(PROJ_STATUS);
const STATUS = [['afazer', 'A fazer'], ['andamento', 'Em andamento'], ['aguardando', 'Aguardando'], ['concluida', 'Concluída']];
const STATUS_NOME = Object.fromEntries(STATUS);
const PRI = { 1: 'Baixa', 2: 'Normal', 3: 'Alta', 4: 'Urgente' };
const CHECK = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M2.5 6.2l2.3 2.3 4.7-5"/></svg>';

function localGet(k) { try { return localStorage.getItem('tarefas.' + k); } catch { return null; } }
function localSet(k, v) { try { localStorage.setItem('tarefas.' + k, v); } catch {} }
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hoje = () => ymd(new Date());
const somaDias = (s, n) => { const [a, m, d] = s.split('-').map(Number); return ymd(new Date(a, m - 1, d + n)); };
const difDias = (a, b) => { const p = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); }; return Math.round((p(b) - p(a)) / 864e5); };
const brData = s => s ? s.split('-').reverse().join('/') : '';
const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const curta = s => { const [, m, d] = s.split('-').map(Number); return `${d} ${MESES[m - 1]}`; };
const quando = t => { const d = new Date(t), h = new Date(); const mesmo = ymd(d) === ymd(h); return (mesmo ? 'hoje' : ymd(d) === somaDias(ymd(h), -1) ? 'ontem' : brData(ymd(d))) + ' às ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };

// ---------------- API ----------------
async function api(metodo, url, corpo) {
  const r = await fetch(url, { method: metodo, headers: corpo ? { 'Content-Type': 'application/json' } : {}, body: corpo ? JSON.stringify(corpo) : undefined });
  if (r.status === 401) { location.href = '/login'; throw new Error('login'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.erro || 'Algo deu errado.');
  return j;
}
function toast(msg, erro) {
  const t = document.createElement('div'); t.className = 'toast' + (erro ? ' erro' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), erro ? 5000 : 2500);
}
async function carrega() {
  const [me, pessoas, projetos, tarefas] = await Promise.all([api('GET', '/api/me'), api('GET', '/api/pessoas'), api('GET', '/api/projetos'), api('GET', '/api/tarefas')]);
  Object.assign(S, { me, pessoas, projetos, tarefas });
}
async function recarrega() { try { await carrega(); desenha(); } catch (e) { if (e.message !== 'login') toast(e.message, true); } }

// ---------------- regras ----------------
const pessoa = e => S.pessoas.find(p => p.email === e);
const nome = e => e ? ((pessoa(e) || {}).nome || e) : 'Sem responsável';
const primeiroNome = e => nome(e).split(' ')[0];
const projeto = id => S.projetos.find(p => p.id === id);
const podeTudo = t => S.me.gestor || t.criadoPor === S.me.email;
const podeStatus = t => podeTudo(t) || t.responsavel === S.me.email;
function situacao(t) {
  if (t.status === 'concluida') return 'ok';
  if (!t.prazo) return 'sem';
  const d = difDias(hoje(), t.prazo);
  return d < 0 ? 'atrasada' : d === 0 ? 'hoje' : d <= 7 ? 'semana' : 'futuro';
}
function seloPrazo(t) {
  const s = situacao(t);
  if (s === 'ok') { const noPrazo = !t.prazo || ymd(new Date(t.concluidaEm)) <= t.prazo; return `<span class="selo ok">${noPrazo ? 'Concluída' : 'Concluída com atraso'}</span>`; }
  if (s === 'sem') return '<span class="selo">Sem prazo</span>';
  const d = difDias(hoje(), t.prazo);
  if (s === 'atrasada') return `<span class="selo atrasada">${-d === 1 ? '1 dia' : -d + ' dias'} de atraso</span>`;
  if (s === 'hoje') return '<span class="selo hoje">Vence hoje</span>';
  if (d === 1) return '<span class="selo semana">Amanhã</span>';
  return `<span class="selo ${s === 'semana' ? 'semana' : ''}">${curta(t.prazo)}</span>`;
}
// ordem: atrasadas primeiro, depois por prazo, depois por prioridade
const ordem = (a, b) => (a.status === 'concluida') - (b.status === 'concluida') || (a.prazo || '9999') .localeCompare(b.prazo || '9999') || b.prioridade - a.prioridade || a.id - b.id;
function noPrazo30(lista) {
  const ini = Date.now() - 30 * 864e5;
  const c = lista.filter(t => t.status === 'concluida' && t.concluidaEm >= ini);
  const comPrazo = c.filter(t => t.prazo);
  const ok = comPrazo.filter(t => ymd(new Date(t.concluidaEm)) <= t.prazo).length;
  return { concl: c.length, pct: comPrazo.length ? Math.round(ok / comPrazo.length * 100) : null };
}

// ---------------- peças ----------------
const CORES = ['#9d162e', '#2b6cb0', '#2f855a', '#b7791f', '#6b46c1', '#c05621', '#2c7a7b', '#b83280'];
function avatar(e, tam) {
  const p = pessoa(e), cls = 'av' + (tam ? ' ' + tam : '');
  if (!e) return `<span class="${cls}" style="background:var(--line);color:var(--muted)" title="Sem responsável">?</span>`;
  if (p && p.foto) return `<img class="${cls}" src="${esc(p.foto)}" alt="" title="${esc(nome(e))}" referrerpolicy="no-referrer">`;
  let h = 0; for (const c of e) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const ini = nome(e).split(/\s+/).filter(Boolean).slice(0, 2).map(x => x[0]).join('').toUpperCase();
  return `<span class="${cls}" style="background:${CORES[h % CORES.length]}" title="${esc(nome(e))}">${esc(ini)}</span>`;
}
function chipProjeto(id) { const p = projeto(id); return p ? `<span class="proj"><i style="background:${esc(p.cor)}"></i>${esc(p.nome)}</span>` : ''; }
function linha(t) {
  const feito = t.status === 'concluida';
  return `<div class="linha ${feito ? 'feita' : ''}" data-id="${t.id}">
    <button class="chk ${feito ? 'on' : ''}" data-chk="${t.id}" ${podeStatus(t) ? '' : 'disabled'} title="${feito ? 'Reabrir' : 'Concluir'}">${feito ? CHECK : ''}</button>
    <div class="tit"><span>${esc(t.titulo)}</span><small>${chipProjeto(t.projetoId)}${t.status !== 'afazer' && !feito ? `<span class="st">${STATUS_NOME[t.status]}</span>` : ''}${t.comentarios ? `<span class="st">💬 ${t.comentarios}</span>` : ''}</small></div>
    <span class="pri p${t.prioridade} esconde-p">${t.prioridade >= 3 ? PRI[t.prioridade] : ''}</span>
    <span class="esconde-p">${avatar(t.responsavel, 'p')}</span>
    ${seloPrazo(t)}
  </div>`;
}
const listaHtml = (ts, vazio) => ts.length ? `<div class="card lista">${ts.map(linha).join('')}</div>` : `<div class="card vazio">${vazio}</div>`;

// ---------------- vistas ----------------
function desenha() {
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('ativo', b.dataset.v === S.vista));
  $('#btnEu').innerHTML = avatar(S.me.email);
  const g = $('.gantt'); if (g) S.gScroll = g.scrollLeft;
  $('#main').innerHTML = { inicio: vInicio, tarefas: vTarefas, cronograma: vCronograma, prazos: vPrazos, projetos: () => S.projetoSel ? vProjeto() : vProjetos(), equipe: vEquipe }[S.vista]();
  const g2 = $('.gantt');
  if (g2) { if (S.gScroll == null) rolaHoje(); else g2.scrollLeft = S.gScroll; }
}
function rolaHoje() { const g = $('.gantt'), h = g && g.querySelector('.g-hoje'); if (h) { g.scrollLeft = Math.max(0, parseFloat(h.style.left) - 150); S.gScroll = g.scrollLeft; } }

// ---------------- cronograma (Gantt) ----------------
const datasT = t => { const i = t.inicio || t.prazo, f = t.prazo || t.inicio; return i ? [i, f] : null; };
const PXDIA = { semanas: 34, meses: 12 };
// monta o Gantt de uma lista de tarefas, em grupos (projeto ou pessoa)
function gantt(ts, agrupar, opts = {}) {
  const px = PXDIA[S.g.escala], h = hoje();
  // intervalo: cobre todas as barras, com folga, e pelo menos de 2 semanas antes a 6 semanas depois de hoje
  let ini = somaDias(h, -14), fim = somaDias(h, 42);
  for (const t of ts) { const d = datasT(t); if (d) { if (d[0] < ini) ini = d[0]; if (d[1] > fim) fim = d[1]; } }
  const projsVis = agrupar === 'projeto' ? S.projetos.filter(p => ts.some(t => t.projetoId === p.id) || opts.projetos?.includes(p.id)) : [];
  for (const p of projsVis) { if (p.inicio && p.inicio < ini) ini = p.inicio; if (p.fim && p.fim > fim) fim = p.fim; }
  ini = somaDias(ini, -3); fim = somaDias(fim, 10);
  // começa num domingo para as semanas ficarem alinhadas
  const d0 = new Date(ini + 'T12:00'); ini = somaDias(ini, -d0.getDay());
  const nd = difDias(ini, fim) + 1, W = nd * px, x = s => difDias(ini, s) * px;
  // cabeçalho: meses e dias
  let meses = '', dias = '', fds = '';
  for (let i = 0; i < nd; i++) {
    const s = somaDias(ini, i), dt = new Date(s + 'T12:00'), dd = dt.getDate(), ds = dt.getDay();
    if (dd === 1 || i === 0) { const resto = Math.min(nd - i, new Date(dt.getFullYear(), dt.getMonth() + 1, 0).getDate() - dd + 1); meses += `<span style="left:${i * px}px;width:${resto * px}px">${MESES[dt.getMonth()]} ${dt.getFullYear()}</span>`; }
    if (px >= 24) dias += `<span class="${s === h ? 'hj' : ''}" style="left:${i * px}px;width:${px}px;text-align:center;padding:0" title="${brData(s)}">${dd}</span>`;
    else if (ds === 1) dias += `<span style="left:${i * px}px;width:${7 * px}px">${dd}</span>`;
    if (ds === 0 || ds === 6) fds += `<div class="g-fds" style="left:${i * px}px;width:${px}px"></div>`;
  }
  const hojeX = h >= ini && h <= fim ? `<div class="g-hoje" style="left:${x(h) + px / 2 - 1}px"></div>` : '';
  const pista = (conteudo, extra = '') => `<div class="g-pista" style="width:${W}px" ${extra}>${fds}${hojeX}${conteudo}</div>`;
  const ativos = S.pessoas.filter(p => p.ativo);
  const linhaT = t => {
    const d = datasT(t), s = situacao(t), cls = 'st-' + (s === 'ok' ? 'concluida' : s === 'atrasada' ? 'atrasada' : t.status), mexe = podeTudo(t);
    let barra = '';
    if (d) {
      const w = (difDias(d[0], d[1]) + 1) * px, cabe = w >= Math.min(220, t.titulo.length * 6.5 + 16);
      barra = `<div class="g-barra ${cls} ${mexe ? 'mexe' : ''} ${cabe ? 'cabe' : ''}" data-barra="${t.id}" style="left:${x(d[0])}px;width:${w}px" title="${esc(t.titulo)} · ${brData(d[0])} a ${brData(d[1])}">
        ${mexe ? '<span class="al e" data-al="e"></span><span class="al d" data-al="d"></span>' : ''}<span class="lb">${esc(t.titulo)}</span></div>`;
    } else if (mexe) barra = `<div class="g-vazia" data-sem-data="${t.id}" title="Clique no dia para marcar a data desta tarefa"></div>`;
    const sel = mexe ? `<select data-designa="${t.id}" title="Responsável"><option value="">—</option>${ativos.map(p => `<option value="${esc(p.email)}" ${p.email === t.responsavel ? 'selected' : ''}>${esc(p.nome.split(' ')[0])}</option>`).join('')}</select>` : avatar(t.responsavel, 'p');
    return `<div class="g-linha"><div class="g-rot"><span class="nm" data-id="${t.id}" title="${esc(t.titulo)}">${esc(t.titulo)}</span>${sel}</div>${pista(barra, `data-pista="${t.id}" data-ini="${ini}" data-px="${px}"`)}</div>`;
  };
  // grupos
  let grupos;
  if (agrupar === 'pessoa') {
    const emails = [...new Set(ts.map(t => t.responsavel || ''))].sort((a, b) => nome(a || null).localeCompare(nome(b || null)));
    grupos = emails.map(e => ({ rot: `${avatar(e || null, 'p')}<span class="nm">${esc(nome(e || null))}</span>`, ts: ts.filter(t => (t.responsavel || '') === e), barra: '' }));
  } else if (agrupar === 'projeto') {
    grupos = projsVis.map(p => {
      const pts = ts.filter(t => t.projetoId === p.id);
      const pb = p.inicio || p.fim ? `<div class="g-barra proj" style="left:${x(p.inicio || p.fim)}px;width:${(difDias(p.inicio || p.fim, p.fim || p.inicio) + 1) * px}px;background:${esc(p.cor)}" title="Projeto: ${brData(p.inicio)} a ${brData(p.fim)}"></div>` : '';
      return { rot: `<i style="width:10px;height:10px;border-radius:3px;background:${esc(p.cor)};flex:none"></i><span class="nm" data-abre-proj="${p.id}">${esc(p.nome)}</span><span class="ct">${pts.length}</span><button class="btn peq" data-nova-no-proj="${p.id}" title="Nova tarefa neste projeto">+</button>`, ts: pts, barra: pb };
    });
    const sem = ts.filter(t => !t.projetoId); if (sem.length) grupos.push({ rot: '<span class="nm">Sem projeto</span>', ts: sem, barra: '' });
  } else grupos = [{ rot: null, ts, barra: '' }];
  const ordemG = (a, b) => ((datasT(a) || ['9999'])[0]).localeCompare((datasT(b) || ['9999'])[0]) || a.id - b.id;
  const corpo = grupos.map(g => (g.rot ? `<div class="g-linha g-grupo"><div class="g-rot">${g.rot}</div>${pista(g.barra)}</div>` : '') + g.ts.slice().sort(ordemG).map(linhaT).join('')).join('');
  return `<div class="card gantt">
    <div class="g-linha g-cab"><div class="g-rot">Tarefa / responsável</div><div class="g-pista" style="width:${W}px"><div class="g-meses">${meses}</div><div class="g-dias">${dias}</div></div></div>
    ${corpo || `<div class="vazio">Nenhuma tarefa para mostrar.</div>`}
  </div>
  <div class="legenda"><span><i style="background:var(--brand)"></i>A fazer</span><span><i style="background:var(--blue)"></i>Em andamento</span><span><i style="background:var(--amber)"></i>Aguardando</span><span><i style="background:var(--red)"></i>Atrasada</span><span><i style="background:var(--green)"></i>Concluída</span>
  <span>Arraste a barra para mudar as datas, puxe as pontas para mudar início ou prazo. Tarefa sem data: clique no dia da linha dela.</span></div>`;
}
function vCronograma() {
  const g = S.g, ativos = S.pessoas.filter(p => p.ativo);
  const opt = (v, txt, sel) => `<option value="${esc(v)}" ${String(sel) === String(v) ? 'selected' : ''}>${esc(txt)}</option>`;
  const ts = S.tarefas.filter(t => (g.concluidas || t.status !== 'concluida') && (!g.resp || (g.resp === '_eu' ? t.responsavel === S.me.email : t.responsavel === g.resp)) && (!g.proj || t.projetoId === +g.proj));
  return `<h2>Cronograma</h2><p class="sub">Linha do tempo das tarefas: início, prazo e quem está com cada uma.</p>
    <div class="filtros">
      <select id="gAgr">${opt('projeto', 'Agrupar por projeto', g.agrupar)}${opt('pessoa', 'Agrupar por pessoa', g.agrupar)}${opt('nada', 'Sem agrupar', g.agrupar)}</select>
      <select id="gResp">${opt('', 'Todas as pessoas', g.resp)}${opt('_eu', 'Comigo', g.resp)}${ativos.map(p => opt(p.email, p.nome, g.resp)).join('')}</select>
      <select id="gProj">${opt('', 'Todos os projetos', g.proj)}${S.projetos.filter(p => p.ativo).map(p => opt(p.id, p.nome, g.proj)).join('')}</select>
      <label style="display:flex;align-items:center;gap:6px;color:var(--muted)"><input type="checkbox" id="gConc" ${g.concluidas ? 'checked' : ''}> Mostrar concluídas</label>
      <button class="btn peq" data-g-hoje>Hoje</button>
      <div class="alterna"><button data-escala="semanas" class="${g.escala === 'semanas' ? 'ativo' : ''}">Dias</button><button data-escala="meses" class="${g.escala === 'meses' ? 'ativo' : ''}">Meses</button></div>
    </div>${gantt(ts, g.agrupar)}`;
}

// ---------------- projetos ----------------
const podeEditarProj = p => S.me.gestor || p.responsavel === S.me.email;
function resumoProj(p) {
  const ts = S.tarefas.filter(t => t.projetoId === p.id), feitas = ts.filter(t => t.status === 'concluida').length;
  const ab = ts.filter(t => t.status !== 'concluida'), atr = ab.filter(t => situacao(t) === 'atrasada').length;
  const pct = ts.length ? Math.round(feitas / ts.length * 100) : 0, h = hoje();
  const restam = p.fim ? difDias(h, p.fim) : null;
  let saude;
  if (p.status === 'concluido') saude = ['ok', 'Concluído'];
  else if (p.status === 'cancelado') saude = ['neutro', 'Cancelado'];
  else if (p.status === 'pausado') saude = ['neutro', 'Pausado'];
  else if (restam != null && restam < 0) saude = ['atrasado', 'Fora do prazo'];
  else if (atr || (restam != null && restam <= 7 && pct < 70 && ts.length)) saude = ['risco', 'Em risco'];
  else if (p.status === 'planejamento') saude = ['neutro', 'Planejamento'];
  else saude = ['ok', 'No prazo'];
  return { ts, feitas, ab: ab.length, atr, pct, restam, saude };
}
const periodo = p => p.inicio || p.fim ? `${p.inicio ? curta(p.inicio) : '?'} → ${p.fim ? curta(p.fim) + (p.fim.slice(0, 4) !== hoje().slice(0, 4) ? ' ' + p.fim.slice(0, 4) : '') : '?'}` : 'Sem datas';

function filtra() {
  const f = S.f, q = f.q.trim().toLowerCase();
  return S.tarefas.filter(t => {
    if (q && !(t.titulo.toLowerCase().includes(q) || (t.descricao || '').toLowerCase().includes(q))) return false;
    if (f.resp === '_eu' && t.responsavel !== S.me.email) return false;
    if (f.resp === '_sem' && t.responsavel) return false;
    if (f.resp && f.resp[0] !== '_' && t.responsavel !== f.resp) return false;
    if (f.proj === '_sem' && t.projetoId) return false;
    if (f.proj && f.proj !== '_sem' && t.projetoId !== +f.proj) return false;
    if (S.modo === 'lista') {
      if (f.sit === 'abertas' && t.status === 'concluida') return false;
      if (f.sit && f.sit !== 'abertas' && f.sit !== 'todas' && t.status !== f.sit) return false;
    }
    if (f.prazo) { const s = situacao(t); if (f.prazo === 'semana' ? !['hoje', 'semana'].includes(s) : s !== f.prazo) return false; }
    return true;
  }).sort(ordem);
}

function vPrazos() {
  if (!S.mes) { const d = new Date(); S.mes = [d.getFullYear(), d.getMonth()]; }
  const [ano, mes] = S.mes, h = hoje();
  const prim = new Date(ano, mes, 1), ini = new Date(ano, mes, 1 - prim.getDay());
  const porDia = {}; for (const t of S.tarefas) if (t.prazo) (porDia[t.prazo] = porDia[t.prazo] || []).push(t);
  let cel = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'].map(d => `<div class="dsem">${d}</div>`).join('');
  for (let i = 0; i < 42; i++) {
    const d = new Date(ini.getFullYear(), ini.getMonth(), ini.getDate() + i), k = ymd(d);
    if (i === 35 && d.getMonth() !== mes) break;
    const ts = (porDia[k] || []).sort(ordem);
    cel += `<div class="dia ${d.getMonth() !== mes ? 'fora' : ''} ${k === h ? 'hoje' : ''} ${k === S.diaSel ? 'sel' : ''}" data-dia="${k}">
      <span class="num">${d.getDate()}</span>${ts.slice(0, 3).map(t => `<span class="ch ${situacao(t)}" title="${esc(t.titulo)}">${esc(t.titulo)}</span>`).join('')}${ts.length > 3 ? `<span class="mais">+${ts.length - 3}</span>` : ''}</div>`;
  }
  const abertas = S.tarefas.filter(t => t.status !== 'concluida').sort(ordem);
  let lado;
  if (S.diaSel) {
    const ts = (porDia[S.diaSel] || []).sort(ordem);
    lado = `<div class="secao" style="margin-top:0"><h3>${new Date(S.diaSel + 'T12:00').toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' })} <span class="n">${ts.length}</span>
      <button class="btn peq" data-limpa-dia style="margin-left:auto">Ver todos</button></h3>${listaHtml(ts, 'Nenhuma tarefa vence neste dia.')}</div>`;
  } else {
    const grupos = [['Atrasadas', t => situacao(t) === 'atrasada'], ['Hoje', t => t.prazo === h], ['Amanhã', t => t.prazo === somaDias(h, 1)],
      ['Próximos 7 dias', t => t.prazo > somaDias(h, 1) && t.prazo <= somaDias(h, 7)], ['Depois', t => t.prazo > somaDias(h, 7)], ['Sem prazo', t => !t.prazo]];
    lado = grupos.map(([n, fn]) => { const ts = abertas.filter(fn); return ts.length ? `<div class="secao" style="margin-top:0;margin-bottom:20px"><h3>${n} <span class="n">${ts.length}</span></h3>${listaHtml(ts, '')}</div>` : ''; }).join('') || '<div class="card vazio">Nenhuma tarefa aberta.</div>';
  }
  return `<h2>Prazos</h2><p class="sub">Calendário de entregas. Clique num dia para ver o que vence nele.</p>
    <div class="prazos-grid">
      <div><div class="cal-topo"><button class="btn peq" data-mes="-1" aria-label="Mês anterior">‹</button><strong>${(s => s[0].toUpperCase() + s.slice(1))(prim.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }))}</strong><button class="btn peq" data-mes="1" aria-label="Próximo mês">›</button><button class="btn peq" data-mes="0">Hoje</button></div>
      <div class="cal">${cel}</div></div>
      <div>${lado}</div>
    </div>`;
}

function vEquipe() {

function abreJanela(titulo, corpo, rodape) {

  f.addEventListener('mousedown', e => { if (e.target === f) fechaJanela(); });
  f.querySelector('[data-fecha]').onclick = fechaJanela;
  document.body.appendChild(f); document.body.style.overflow = 'hidden';
  const p = f.querySelector('input:not([disabled]),textarea:not([disabled])'); if (p && !matchMedia('(max-width:640px)').matches) p.focus();
  return f;
}

function revisaNarracao(p, textoOriginal) {
  const ativos = S.pessoas.filter(x => x.ativo);

      <input type="text" value="${esc(n.nome)}" data-pnome maxlength="80"><span class="dica">${n.responsavel ? esc(nome(n.responsavel)) + ' · ' : ''}${n.inicio ? brData(n.inicio) : '?'} a ${n.fim ? brData(n.fim) : '?'}</span></div>`).join('');
  const linhas = p.tarefas.map((t, i) => `<div class="prop" data-i="${i}">

      <input type="text" value="${esc(t.titulo)}" data-k="titulo" maxlength="160">
      <select data-k="responsavel">${optsResp(t.responsavel)}</select>
      <select data-k="projeto">${optsProj(t.projetoNovoRef ? 'n:' + t.projetoNovoRef : t.projetoId)}</select>
      <input type="date" value="${esc(t.inicio || '')}" data-k="inicio" title="Início">
      <input type="date" value="${esc(t.prazo || '')}" data-k="prazo" title="Prazo">
      <select data-k="prioridade">${[4, 3, 2, 1].map(k => opt(k, PRI[k], t.prioridade)).join('')}</select>
      ${t.descricao ? `<div class="det">${esc(t.descricao)}</div>` : ''}

  const corpo = `
    ${p.resumo ? `<div class="resumo-ia">✨ ${esc(p.resumo)}</div>` : ''}
    ${p.duvidas.length ? `<div class="duvidas"><b>Confira antes de criar:</b><ul>${p.duvidas.map(d => `<li>${esc(d)}</li>`).join('')}</ul></div>` : ''}
    ${novos}
    ${p.tarefas.length ? `<div class="prop cab"><span></span><span>Tarefa</span><span>Responsável</span><span>Projeto</span><span>Início</span><span>Prazo</span><span>Prioridade</span></div>${linhas}`
      : '<div class="card vazio">A IA não encontrou tarefas nesta narração. Volte e descreva o que precisa ser feito.</div>'}`;
  const n = p.tarefas.length;
  const j = abreJanela('Confira as tarefas', corpo, `<button class="btn esq" id="nVolta">‹ Voltar e editar a narração</button><button class="btn" data-fecha2>Cancelar</button>${n ? `<button class="btn prim" id="nCria">Criar ${n} ${n === 1 ? 'tarefa' : 'tarefas'}</button>` : ''}`);
  j.querySelector('.janela').classList.add('larga');
  j.querySelector('[data-fecha2]').onclick = fechaJanela;
  j.querySelector('#nVolta').onclick = () => janelaNarrar(textoOriginal);
  const conta = () => { const k = j.querySelectorAll('[data-on]:checked').length, b = j.querySelector('#nCria'); if (b) { b.textContent = `Criar ${k} ${k === 1 ? 'tarefa' : 'tarefas'}`; b.disabled = !k; } };
  j.addEventListener('change', e => {
    if (e.target.matches('[data-on]')) { e.target.closest('.prop').classList.toggle('off', !e.target.checked); conta(); }
    if (e.target.matches('[data-pon]')) e.target.closest('.pnovo').style.opacity = e.target.checked ? 1 : .45;

      const pr = v('projeto'), projetoId = pr.startsWith('n:') ? (idDoNovo[pr.slice(2)] || null) : (pr ? +pr : null);
      let inicio = v('inicio') || null, prazo = v('prazo') || null; if (inicio && prazo && prazo < inicio) [inicio, prazo] = [prazo, inicio];

    const unico = Object.values(idDoNovo)[0];
    S.vista = 'cronograma'; S.projetoSel = null; S.gScroll = null; if (unico) S.g.proj = String(unico);
    await recarrega(); window.scrollTo(0, 0);
  };
}

let arr = null;
function salvaDatas(t, inicio, prazo, ant) {
  t.inicio = inicio; t.prazo = prazo; desenha();
  api('PUT', '/api/tarefas/' + t.id, { inicio, prazo }).then(() => { toast(`${t.titulo}: ${brData(inicio)}${inicio !== prazo ? ' a ' + brData(prazo) : ''}`); recarregaSilencioso(); })
    .catch(e => { t.inicio = ant[0]; t.prazo = ant[1]; desenha(); toast(e.message, true); });
}
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-barra]'); if (!b || e.button !== 0) return;
  const t = S.tarefas.find(x => x.id === +b.dataset.barra); if (!t) return;
  const pista = b.closest('[data-pista]');
  arr = { t, b, x0: e.clientX, px: +pista.dataset.px, modo: e.target.dataset.al || 'mover', d: datasT(t), l0: parseFloat(b.style.left), w0: parseFloat(b.style.width), mexe: podeTudo(t), moveu: false };
  if (arr.mexe) { try { b.setPointerCapture(e.pointerId); } catch {} e.preventDefault(); }
});
document.addEventListener('pointermove', e => {
  if (!arr || !arr.mexe) return;
  const dd = Math.round((e.clientX - arr.x0) / arr.px); if (dd !== 0) arr.moveu = true; arr.dd = dd;
  const { b, l0, w0, px, modo } = arr;
  if (modo === 'mover') b.style.left = l0 + dd * px + 'px';
  else if (modo === 'e') { const d = Math.min(dd, w0 / px - 1); b.style.left = l0 + d * px + 'px'; b.style.width = w0 - d * px + 'px'; }
  else { const d = Math.max(dd, 1 - w0 / px); b.style.width = w0 + d * px + 'px'; }
});
document.addEventListener('pointerup', () => {
  if (!arr) return; const a = arr; arr = null;
  if (!a.moveu) { janelaTarefa(a.t); return; }
  const n = a.w0 / a.px - 1; let [i, f] = a.d, dd = a.dd;
  if (a.modo === 'mover') { i = somaDias(i, dd); f = somaDias(f, dd); }
  else if (a.modo === 'e') i = somaDias(i, Math.min(dd, n));
  else f = somaDias(f, Math.max(dd, -n));
  salvaDatas(a.t, i, f, [a.t.inicio, a.t.prazo]);
});
document.addEventListener('pointercancel', () => { if (arr) { arr = null; desenha(); } });

async function mudaStatus(id, status) {
  const t = S.tarefas.find(x => x.id === id); if (!t || t.status === status) return;
  const ant = t.status; t.status = status; if (status === 'concluida') t.concluidaEm = Date.now(); desenha();
  try { await api('PUT', '/api/tarefas/' + id, { status }); if (status === 'concluida') toast('Tarefa concluída.'); recarregaSilencioso(); }
  catch (e) { t.status = ant; desenha(); toast(e.message, true); }
}

document.getElementById('nav').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.vista = b.dataset.v; S.projetoSel = null; S.gScroll = null; desenha(); window.scrollTo(0, 0); };
$('#btnNarrar').onclick = () => janelaNarrar('');
$('#btnNova').onclick =() => janelaTarefa(null, S.vista === 'prazos' && S.diaSel ? { prazo: S.diaSel } : null);
$('#btnEu').onclick = e => { e.stopPropagation(); const p = $('#popEu'), ag = S.me.agenda || {};
  const agHtml = !ag.disponivel ? '' : ag.conectado
    ? `<div style="border-bottom:0;margin:0;padding-bottom:2px">📅 Google Agenda conectado<br><small>${ag.eventos} ${ag.eventos === 1 ? 'tarefa' : 'tarefas'} na sua agenda</small></div>
       <button id="agSinc">Sincronizar agora</button><button id="agDesc">Desconectar Google Agenda</button><hr style="border:0;border-top:1px solid var(--line);margin:4px 0">`
    : `<button id="agCon">📅 ${ag.erro ? 'Reconectar' : 'Conectar'} Google Agenda</button>${ag.erro ? `<div style="color:var(--red);border:0">${esc(ag.erro)}</div>` : ''}<hr style="border:0;border-top:1px solid var(--line);margin:4px 0">`;
  p.innerHTML = `<div>${esc(S.me.nome)}<br>${esc(S.me.email)}${S.me.gestor ? '<br><b>Gestor</b>' : ''}</div>${agHtml}<button id="sair">Sair</button>`;
  p.classList.toggle('oculto'); $('#sair').onclick = async () => { await fetch('/api/logout', { method: 'POST' }); location.href = '/login'; };
  const con = $('#agCon'); if (con) con.onclick = () => { location.href = '/api/google/conectar'; };
  const sinc = $('#agSinc'); if (sinc) sinc.onclick = async () => { sinc.disabled = true; sinc.textContent = 'Sincronizando…'; try { const r = await api('POST', '/api/google/sincronizar'); toast(`Agenda atualizada (${r.tarefas} ${r.tarefas === 1 ? 'tarefa conferida' : 'tarefas conferidas'}).`); await recarrega(); } catch (er) { toast(er.message, true); } p.classList.add('oculto'); };
  const desc = $('#agDesc'); if (desc) desc.onclick = async () => {
    if (!confirm('Desconectar o Google Agenda? Os eventos que o sistema criou na sua agenda serão removidos.')) return;
    try { await api('POST', '/api/google/desconectar'); toast('Google Agenda desconectado.'); await recarrega(); } catch (er) { toast(er.message, true); } p.classList.add('oculto'); }; };
document.addEventListener('click', e => { if (!e.target.closest('.menu-eu')) $('#popEu').classList.add('oculto'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') fechaJanela(); });

const main = $('#main');
main.addEventListener('click', e => {
  const chk = e.target.closest('[data-chk]');
  if (chk) { e.stopPropagation(); const t = S.tarefas.find(x => x.id === +chk.dataset.chk); mudaStatus(t.id, t.status === 'concluida' ? 'afazer' : 'concluida'); return; }
  const ir = e.target.closest('[data-ir]');
  if (ir) { S.vista = 'tarefas'; S.modo = 'lista'; S.f = { q: '', resp: '', proj: '', sit: 'abertas', prazo: { atrasadas: 'atrasada', hoje: 'hoje', semana: 'semana' }[ir.dataset.ir] }; desenha(); return; }
  const md = e.target.closest('[data-modo]'); if (md) { S.modo = md.dataset.modo; localSet('modo', S.modo); desenha(); return; }
  const mes = e.target.closest('[data-mes]');
  if (mes) { const n = +mes.dataset.mes; if (n === 0) { const d = new Date(); S.mes = [d.getFullYear(), d.getMonth()]; } else { const d = new Date(S.mes[0], S.mes[1] + n, 1); S.mes = [d.getFullYear(), d.getMonth()]; } desenha(); return; }
  if (e.target.closest('[data-limpa-dia]')) { S.diaSel = null; desenha(); return; }
  const dia = e.target.closest('[data-dia]'); if (dia) { S.diaSel = S.diaSel === dia.dataset.dia ? null : dia.dataset.dia; desenha(); return; }
  const ep = e.target.closest('[data-edita-pessoa]'); if (ep) { e.stopPropagation(); janelaPessoa(pessoa(ep.dataset.editaPessoa)); return; }
  const ej = e.target.closest('[data-edita-proj]'); if (ej) { e.stopPropagation(); janelaProjeto(projeto(+ej.dataset.editaProj)); return; }
  if (e.target.closest('#btnAddPessoa')) { janelaPessoa(null); return; }
  if (e.target.closest('#btnAddProj')) { janelaProjeto(null); return; }
  if (e.target.closest('[data-designa]')) return;
  if (e.target.closest('[data-dispensa-agenda]')) { localSet('agendaDispensada', '1'); desenha(); toast('Você pode conectar depois pelo menu da sua conta (canto superior direito).'); return; }
  const np = e.target.closest('[data-nova-no-proj]'); if (np) { e.stopPropagation(); janelaTarefa(null, { projetoId: +np.dataset.novaNoProj }); return; }
  const ap = e.target.closest('[data-abre-proj]'); if (ap) { S.vista = 'projetos'; S.projetoSel = +ap.dataset.abreProj; S.gScroll = null; desenha(); window.scrollTo(0, 0); return; }
  if (e.target.closest('[data-voltar-proj]')) { S.projetoSel = null; desenha(); return; }
  const esc_ = e.target.closest('[data-escala]'); if (esc_) { S.g.escala = esc_.dataset.escala; localSet('escala', S.g.escala); S.gScroll = null; desenha(); return; }
  if (e.target.closest('[data-g-hoje]')) { rolaHoje(); return; }
  const sd = e.target.closest('[data-sem-data]');
  if (sd) {
    const t = S.tarefas.find(x => x.id === +sd.dataset.semData), pista = sd.closest('[data-pista]');
    const dia = somaDias(pista.dataset.ini, Math.floor((e.clientX - pista.getBoundingClientRect().left) / +pista.dataset.px));
    salvaDatas(t, dia, dia, [t.inicio, t.prazo]); return;
  }
  if (e.target.closest('[data-barra]')) return;
  const pr = e.target.closest('[data-pessoa]'); if (pr) { S.vista = 'tarefas'; S.f = { q: '', resp: pr.dataset.pessoa, proj: '', sit: 'abertas', prazo: '' }; desenha(); return; }
  const it = e.target.closest('[data-id]'); if (it) { const t = S.tarefas.find(x => x.id === +it.dataset.id); if (t) janelaTarefa(t); }
});
main.addEventListener('change', async e => {
  const ds = e.target.closest('[data-designa]');
  if (ds) {
    const t = S.tarefas.find(x => x.id === +ds.dataset.designa), ant = t.responsavel, novo = ds.value || null;
    t.responsavel = novo;
    try { await api('PUT', '/api/tarefas/' + t.id, { responsavel: novo }); toast(`${t.titulo} → ${nome(novo)}`); recarregaSilencioso(); }
    catch (er) { t.responsavel = ant; desenha(); toast(er.message, true); }
    return;
  }
  const gm = { gAgr: 'agrupar', gResp: 'resp', gProj: 'proj' }[e.target.id];
  if (gm) { S.g[gm] = e.target.value; if (gm === 'agrupar') localSet('agrupar', e.target.value); desenha(); return; }
  if (e.target.id === 'gConc') { S.g.concluidas = e.target.checked; desenha(); return; }
  if (e.target.id === 'pFiltro') { S.pf = e.target.value; desenha(); }
});
main.addEventListener('input', e => {
  const map ={ fQ: 'q', fResp: 'resp', fProj: 'proj', fSit: 'sit', fPrazo: 'prazo' }, k = map[e.target.id]; if (!k) return;
  S.f[k] = e.target.value;
  if (k === 'q') { const pos = e.target.selectionStart; desenha(); const i = $('#fQ'); i.focus(); i.setSelectionRange(pos, pos); } else desenha();
});
// arrastar no quadro
let arrastado = null;
main.addEventListener('dragstart', e => { const c = e.target.closest('.cartao'); if (!c) return; arrastado = +c.dataset.id; c.classList.add('arrastando'); e.dataTransfer.effectAllowed = 'move'; });
main.addEventListener('dragend', e => { const c = e.target.closest('.cartao'); if (c) c.classList.remove('arrastando'); document.querySelectorAll('.coluna.alvo').forEach(x => x.classList.remove('alvo')); });
main.addEventListener('dragover', e => { const col = e.target.closest('.coluna'); if (!col || arrastado == null) return; e.preventDefault(); document.querySelectorAll('.coluna.alvo').forEach(x => x !== col && x.classList.remove('alvo')); col.classList.add('alvo'); });
main.addEventListener('drop', e => { const col = e.target.closest('.coluna'); if (!col || arrastado == null) return; e.preventDefault(); const id = arrastado; arrastado = null; mudaStatus(id, col.dataset.col); });

// atualiza sozinho a cada minuto e ao voltar para a aba
setInterval(() => { if (!document.hidden) recarregaSilencioso(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) recarregaSilencioso(); });

// volta da conexão com o Google Agenda
(() => {
  const u = new URLSearchParams(location.search), a = u.get('agenda'); if (!a) return;
  history.replaceState(null, '', '/');
  const msg = { conectado: ['Google Agenda conectado. Suas tarefas estão indo para a agenda.'], cancelado: ['Conexão com o Google Agenda cancelada.'],
    indisponivel: ['A integração com o Google Agenda ainda não foi configurada no servidor.', true], erro: [u.get('msg') || 'Não foi possível conectar o Google Agenda.', true] }[a];
  if (msg) setTimeout(() => toast(msg[0], msg[1]), 300);
})();
recarrega();
</script>
</body>
</html>
